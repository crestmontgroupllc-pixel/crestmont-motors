<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crestmont Motors - Bienvenido</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .slide-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
        }
        .slide-bg.active {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-black text-white h-screen overflow-hidden flex flex-col justify-between relative font-sans">

    <!-- Carrusel de Fondos en Capas -->
    <div id="slider-container" class="absolute inset-0 z-0">
        <div class="slide-bg active" style="background-image: url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=1920&q=80');"></div>
    </div>

    <!-- Filtro oscuro para dar elegancia -->
    <div class="absolute inset-0 bg-black/55 z-0 backdrop-brightness-90"></div>

    <!-- Contenido Principal Centrado -->
    <div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-4 max-w-4xl mx-auto">
        
        <h1 class="text-3xl md:text-5xl lg:text-6xl font-light tracking-wide mb-4 drop-shadow-md">
            La Familia de Concesionarios Crestmont
        </h1>
        
        <p class="text-base md:text-xl font-light text-gray-200 mb-10 max-w-2xl drop-shadow">
            Descubre nuestra gama exclusiva de vehículos, servicios de importación y atención personalizada.
        </p>

        <!-- Botón que redirige a tu sitio completo -->
        <div class="flex justify-center items-center w-full">
            <a href="catalogo/" class="w-full sm:w-auto min-w-[260px] text-center border border-white/80 bg-white/10 hover:bg-white hover:text-black transition-all duration-300 py-3.5 px-8 rounded-full text-base font-medium tracking-wider backdrop-blur-md shadow-2xl">
                Entrar al Sitio Oficial
            </a>
        </div>

    </div>

    <!-- Script del Carrusel Automático -->
    <script>
        const slides = document.querySelectorAll('.slide-bg');
        let currentSlide = 0;

        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);
    </script>
</body>
</html>
