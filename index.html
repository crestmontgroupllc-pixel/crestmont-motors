<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crestmont Motors - Bienvenido</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .slide-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
        }
        .slide-bg.active {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-black text-white h-screen overflow-hidden flex flex-col justify-between relative font-sans">

    <!-- Carrusel de Fondos con los 7 vehículos (Incluyendo Toyota) -->
    <div id="slider-container" class="absolute inset-0 z-0">
        <div class="slide-bg active" style="background-image: url('https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?auto=format&fit=crop&w=1920&q=80');"></div>
    </div>

    <!-- Filtro oscuro con degradado para máxima elegancia y legibilidad -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/50 to-black/30 z-0"></div>

    <!-- Contenido Principal -->
    <div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-4 max-w-5xl mx-auto">
        
        <!-- Bloque de Texto Estilizado -->
        <div class="space-y-4 mb-10">
            <span class="text-xs md:text-sm uppercase tracking-[0.3em] text-gray-300 font-medium block">
                The Crestmont Family of Dealerships
            </span>
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-extralight tracking-tight text-white drop-shadow-lg">
                Crestmont Motors <br>
                <span class="font-normal text-white">te da la bienvenida</span>
            </h1>
            <p class="text-base md:text-xl font-light text-gray-200 max-w-2xl mx-auto pt-2 drop-shadow">
                Descubre nuestra gama exclusiva de vehículos, servicios importados y atención personalizada.
            </p>
        </div>

        <!-- Botón de Entrada Elegante -->
        <div class="flex justify-center items-center w-full">
            <a href="catalogo/" class="group relative inline-flex items-center justify-center px-8 py-4 text-base font-medium tracking-wider text-white transition-all duration-300 bg-white/10 rounded-full border border-white/40 backdrop-blur-md hover:bg-white hover:text-black hover:border-white shadow-2xl">
                <span>Entrar al Sitio Oficial</span>
                <svg class="w-5 h-5 ml-2 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>
        </div>

    </div>

    <!-- Script del Carrusel (Rotación cada 5 segundos) -->
    <script>
        const slides = document.querySelectorAll('.slide-bg');
        let currentSlide = 0;

        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);
    </script>
</body>
</html>
