<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicación y Carga - Crestmont Motors</title>
  <style>
    body { font-family: Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
    
    .login-card { max-width: 420px; margin: 100px auto; background: #111; border: 1px solid #333; padding: 45px; border-radius: 10px; box-shadow: 0 8px 25px rgba(255,0,0,0.15); text-align: center; }
    .login-card h2 { margin-top: 0; color: #ff0000; font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    .login-card p { color: #aaa; font-size: 15px; margin-bottom: 30px; }
    .login-card input { width: 100%; padding: 15px; margin-bottom: 18px; border: 1px solid #444; background: #1a1a1a; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; }
    .login-card input::placeholder { color: #777; }
    .login-card button { width: 100%; background: #ff0000; color: #fff; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    .login-card button:hover { background: #cc0000; }
    .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 15px; display: none; }

    .container { max-width: 800px; margin: 40px auto; background: #111; border: 1px solid #333; padding: 35px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 20px; }
    h1 { color: #ff0000; margin: 0; font-size: 26px; }
    .btn-logout { background: #ff0000; color: #fff; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-logout:hover { background: #cc0000; }
    .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .form-group label { font-weight: bold; font-size: 15px; color: #ddd; }
    .form-group input, .form-group textarea { padding: 12px; border: 1px solid #444; background: #1a1a1a; color: #fff; border-radius: 6px; font-size: 15px; }
    .btn-save { background: #ff0000; color: #fff; padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; }
    .btn-save:hover { background: #cc0000; }

    /* VISTA PREVIA DE FOTOS EN MINIATURA */
    .preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .preview-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 2px solid #ff0000; }
    .preview-info { font-size: 13px; color: #aaa; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- PANTALLA DE ACCESO -->
  <div class="login-card" id="login-screen">
    <h2>CRESTMONT MOTORS</h2>
    <p>Publicación y Carga de Vehículos</p>
    <input type="text" id="login-user" placeholder="Usuario">
    <input type="password" id="login-pass" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Iniciar Sesión</button>
    <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos</div>
  </div>

  <!-- PANEL DE GESTIÓN Y CARGA -->
  <div class="container" id="panel-admin">
    <div class="header-bar">
      <h1>Publicación y Carga de Vehículos</h1>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div class="form-group">
      <label>VIN / Chasis:</label>
      <input type="text" id="vin-auto" placeholder="Ej: 1HGCR2F83HA000000">
    </div>
    <div class="form-group">
      <label>Título / Modelo del Vehículo:</label>
      <input type="text" id="titulo-auto" placeholder="Ej: Toyota Hilux 2024">
    </div>
    <div class="form-group">
      <label>Año:</label>
      <input type="number" id="ano-auto" placeholder="Ej: 2024">
    </div>
    <div class="form-group">
      <label>Precio ($):</label>
      <input type="number" id="precio-auto" placeholder="Ej: 25000">
    </div>
    <div class="form-group">
      <label>Descripción / Detalles:</label>
      <textarea id="desc-auto" rows="3" placeholder="Kilometraje, transmisión, color..."></textarea>
    </div>
    
    <div class="form-group">
      <label>Fotos del Vehículo (Selecciona varias fotos a la vez):</label>
      <!-- Input con propiedad multiple asegurada por JS y HTML -->
      <input type="file" id="foto-auto" accept="image/*" multiple onchange="manejarSeleccionFotos(event)">
      <div class="preview-info" id="preview-info">Ninguna foto seleccionada</div>
      <div class="preview-container" id="preview-container"></div>
    </div>

    <button class="btn-save" onclick="guardarVehiculo()">Publicar Vehículo y Enviar a Inventario</button>
  </div>

  <script>
    let imagenesArrayGlobal = [];

    document.addEventListener("DOMContentLoaded", function() {
      if (sessionStorage.getItem("admin_autorizado") === "true") {
        mostrarPanel();
      }
      // Forzar atributo multiple desde el código por seguridad de navegadores
      document.getElementById("foto-auto").setAttribute("multiple", "true");
    });

    function iniciarSesion() {
      const u = document.getElementById("login-user").value.trim();
      const p = document.getElementById("login-pass").value;
      const usuarios = JSON.parse(localStorage.getItem("usuarios_crestmont")) || [{ usuario: "admin", pass: "admin123" }];
      const coincide = usuarios.some(user => user.usuario === u && user.pass === p);

      if (coincide || (u === "admin" && p === "admin123")) {
        sessionStorage.setItem("admin_autorizado", "true");
        mostrarPanel();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function mostrarPanel() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("panel-admin").style.display = "block";
    }

    function cerrarSesion() {
      sessionStorage.removeItem("admin_autorizado");
      window.location.reload();
    }

    function manejarSeleccionFotos(event) {
      const files = event.target.files;
      const container = document.getElementById("preview-container");
      const info = document.getElementById("preview-info");
      
      if (!files || files.length === 0) return;

      info.innerText = `Cargando ${files.length} foto(s)...`;

      // Leemos cada archivo seleccionado y lo acumulamos en el arreglo global
      Array.from(files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          imagenesArrayGlobal.push(e.target.result);
          
          // Crear miniatura visual
          const thumb = document.createElement("img");
          thumb.src = e.target.result;
          thumb.className = "preview-thumb";
          container.appendChild(thumb);

          info.innerText = `✅ ${imagenesArrayGlobal.length} foto(s) seleccionada(s) en total`;
        };
        reader.readAsDataURL(file);
      });
    }

    function guardarVehiculo() {
      const vin = document.getElementById("vin-auto").value.trim();
      const titulo = document.getElementById("titulo-auto").value.trim();
      const ano = document.getElementById("ano-auto").value;
      const precio = document.getElementById("precio-auto").value;
      const desc = document.getElementById("desc-auto").value;

      if (!titulo || !precio) {
        alert("Por favor completa al menos el título y el precio del vehículo.");
        return;
      }

      let inventario = JSON.parse(localStorage.getItem("inventario_crestmont")) || [];
      
      const nuevoItem = {
        vin: vin || "S/N",
        vehiculo: titulo,
        ano: ano || "N/A",
        precio: precio,
        estado: "Disponible",
        descripcion: desc,
        imagenes: imagenesArrayGlobal
      };

      inventario.push(nuevoItem);
      localStorage.setItem("inventario_crestmont", JSON.stringify(inventario));

      alert(`✅ Vehículo publicado con éxito con ${imagenesArrayGlobal.length} foto(s) y enviado al inventario.`);
      
      // Limpiar formulario y variables
      document.getElementById("vin-auto").value = "";
      document.getElementById("titulo-auto").value = "";
      document.getElementById("ano-auto").value = "";
      document.getElementById("precio-auto").value = "";
      document.getElementById("desc-auto").value = "";
      document.getElementById("foto-auto").value = "";
      document.getElementById("preview-container").innerHTML = "";
      document.getElementById("preview-info").innerText = "Ninguna foto seleccionada";
      imagenesArrayGlobal = [];
    }
  </script>

</body>
</html>
