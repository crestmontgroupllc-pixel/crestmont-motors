<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicación y Carga - Crestmont Motors</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 15px; }
    
    .login-card { max-width: 420px; margin: 80px auto; background: #111; border: 1px solid #333; padding: 35px 25px; border-radius: 10px; box-shadow: 0 8px 25px rgba(255,0,0,0.15); text-align: center; }
    .login-card h2 { margin-top: 0; color: #ff0000; font-size: 26px; font-weight: bold; letter-spacing: 1px; }
    .login-card p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
    .login-card input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #444; background: #1a1a1a; color: #fff; border-radius: 6px; font-size: 16px; text-align: center; outline: none; }
    .login-card input::placeholder { color: #777; }
    .login-card button { width: 100%; background: #ff0000; color: #fff; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    .login-card button:hover { background: #cc0000; }
    .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 15px; display: none; }

    .container { max-width: 800px; margin: 20px auto; background: #111; border: 1px solid #333; padding: 25px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; }
    .header-bar { display: flex; flex-direction: column; gap: 15px; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 20px; }
    @media (min-width: 768px) {
        .header-bar { flex-direction: row; align-items: center; }
        body { padding: 20px; }
        .container { padding: 35px; }
        .login-card { padding: 45px; }
    }
    h1 { color: #ff0000; margin: 0; font-size: 24px; }
    .btn-logout { background: #ff0000; color: #fff; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    @media (min-width: 768px) { .btn-logout { width: auto; } }
    .btn-logout:hover { background: #cc0000; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .form-group label { font-weight: bold; font-size: 14px; color: #ddd; }
    .form-group input, .form-group textarea { padding: 12px; border: 1px solid #444; background: #1a1a1a; color: #fff; border-radius: 6px; font-size: 15px; outline: none; width: 100%; }
    .form-group textarea { resize: vertical; }
    
    .btn-save { background: #ff0000; color: #fff; padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; transition: background 0.3s; }
    .btn-save:hover { background: #cc0000; }

    /* ESTILOS PARA LA VISTA PREVIA Y CONTADOR */
    .preview-container { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; max-height: 250px; overflow-y: auto; padding: 5px; border: 1px dashed #333; border-radius: 6px; }
    .thumb-wrapper { position: relative; width: 75px; height: 75px; }
    .preview-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 2px solid #ff0000; }
    .btn-remove { position: absolute; top: -6px; right: -6px; background: #ff0000; color: #fff; border: 2px solid #000; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .btn-remove:hover { background: #cc0000; }
    .preview-info { font-size: 14px; color: #ff0000; font-weight: bold; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>

  <!-- PANTALLA DE ACCESO -->
  <div class="login-card" id="login-screen">
    <h2>CRESTMONT MOTORS</h2>
    <p>Publicación y Carga de Vehículos</p>
    <input type="text" id="login-user" placeholder="Usuario">
    <input type="password" id="login-pass" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Iniciar Sesión</button>
    <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos</div>
  </div>

  <!-- PANEL DE GESTIÓN Y CARGA -->
  <div class="container" id="panel-admin">
    <div class="header-bar">
      <h1>Publicación y Carga de Vehículos</h1>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div class="form-group">
      <label>VIN / Chasis:</label>
      <input type="text" id="vin-auto" placeholder="Ej: 1HGCR2F83HA000000">
    </div>
    <div class="form-group">
      <label>Título / Modelo del Vehículo:</label>
      <input type="text" id="titulo-auto" placeholder="Ej: Toyota Hilux 2024">
    </div>
    <div class="form-group">
      <label>Año:</label>
      <input type="number" id="ano-auto" placeholder="Ej: 2024">
    </div>
    <div class="form-group">
      <label>Precio ($):</label>
      <input type="number" id="precio-auto" placeholder="Ej: 25000">
    </div>
    <div class="form-group">
      <label>Descripción / Detalles:</label>
      <textarea id="desc-auto" rows="3" placeholder="Kilometraje, transmisión, color..."></textarea>
    </div>
    
    <div class="form-group">
      <label>Fotos del Vehículo (Puedes seleccionar 20 fotos o más a la vez):</label>
      <input type="file" id="foto-auto" accept="image/*" multiple onchange="manejarSeleccionFotos(event)">
      <!-- CONTADOR DINÁMICO DE FOTOS -->
      <div class="preview-info" id="preview-info">📁 0 fotos seleccionadas (Sube hasta 20 fotos o más)</div>
      <div class="preview-container" id="preview-container"></div>
    </div>

    <button class="btn-save" onclick="guardarVehiculo()">Publicar Vehículo y Enviar a Inventario</button>
  </div>

  <script>
    let imagenesArrayGlobal = [];

    document.addEventListener("DOMContentLoaded", function() {
      if (sessionStorage.getItem("admin_autorizado") === "true") {
        mostrarPanel();
      }
      document.getElementById("foto-auto").setAttribute("multiple", "true");
      actualizarVistaPrevia();
    });

    function iniciarSesion() {
      const u = document.getElementById("login-user").value.trim();
      const p = document.getElementById("login-pass").value;
      const usuarios = JSON.parse(localStorage.getItem("usuarios_crestmont")) || [{ usuario: "admin", pass: "admin123" }];
      const coincide = usuarios.some(user => user.usuario === u && user.pass === p);

      if (coincide || (u === "admin" && p === "admin123")) {
        sessionStorage.setItem("admin_autorizado", "true");
        mostrarPanel();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function mostrarPanel() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("panel-admin").style.display = "block";
    }

    function cerrarSesion() {
      sessionStorage.removeItem("admin_autorizado");
      window.location.reload();
    }

    // COMPRESOR AUTOMÁTICO SOPORTANDO MÚLTIPLES FOTOS (20+)
    function manejarSeleccionFotos(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      Array.from(files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            const maxWidth = 800;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.7);
            
            imagenesArrayGlobal.push(compressedDataUrl);
            actualizarVistaPrevia();
          };
        };
        reader.readAsDataURL(file);
      });
      
      event.target.value = "";
    }

    function actualizarVistaPrevia() {
      const container = document.getElementById("preview-container");
      const info = document.getElementById("preview-info");
      container.innerHTML = "";

      const totalFotos = imagenesArrayGlobal.length;

      if (totalFotos === 0) {
        info.innerHTML = `📁 0 fotos seleccionadas (Selecciona 20 fotos o más para tu galería)`;
        info.style.color = "#aaa";
        return;
      }

      info.innerHTML = `✅ ${totalFotos} foto(s) cargada(s) y listas para la galería`;
      info.style.color = "#2ecc71";

      imagenesArrayGlobal.forEach((imgSrc, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "thumb-wrapper";

        const thumb = document.createElement("img");
        thumb.src = imgSrc;
        thumb.className = "preview-thumb";

        const btnRemove = document.createElement("button");
        btnRemove.className = "btn-remove";
        btnRemove.innerHTML = "×";
        btnRemove.title = "Eliminar foto";
        btnRemove.onclick = function() {
          eliminarFoto(index);
        };

        wrapper.appendChild(thumb);
        wrapper.appendChild(btnRemove);
        container.appendChild(wrapper);
      });
    }

    function eliminarFoto(index) {
      imagenesArrayGlobal.splice(index, 1);
      actualizarVistaPrevia();
    }

    function guardarVehiculo() {
      const vin = document.getElementById("vin-auto").value.trim();
      const titulo = document.getElementById("titulo-auto").value.trim();
      const ano = document.getElementById("ano-auto").value;
      const precio = document.getElementById("precio-auto").value;
      const desc = document.getElementById("desc-auto").value;

      if (!titulo || !precio) {
        alert("Por favor completa al menos el título y el precio del vehículo.");
        return;
      }

      let inventario = JSON.parse(localStorage.getItem("inventario_crestmont")) || [];
      
      const nuevoItem = {
        vin: vin || "S/N",
        vehiculo: titulo,
        ano: ano || "N/A",
        precio: precio,
        estado: "Disponible",
        descripcion: desc,
        imagenes: imagenesArrayGlobal
      };

      try {
        inventario.push(nuevoItem);
        localStorage.setItem("inventario_crestmont", JSON.stringify(inventario));
        alert(`✅ ¡Vehículo publicado con éxito con sus ${imagenesArrayGlobal.length} fotos guardadas en la galería!`);
        
        document.getElementById("vin-auto").value = "";
        document.getElementById("titulo-auto").value = "";
        document.getElementById("ano-auto").value = "";
        document.getElementById("precio-auto").value = "";
        document.getElementById("desc-auto").value = "";
        document.getElementById("foto-auto").value = "";
        imagenesArrayGlobal = [];
        actualizarVistaPrevia();
      } catch (error) {
        alert("⚠️ El almacenamiento se ha llenado. Intenta subir un número razonable de fotos de alta calidad.");
        console.error(error);
      }
    }
  </script>

</body>
</html>
