<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inventario - Crestmont Motors</title>
  <style>
    body { font-family: Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
    
    .login-card { max-width: 420px; margin: 100px auto; background: #111; border: 1px solid #333; padding: 45px; border-radius: 10px; box-shadow: 0 8px 25px rgba(255,0,0,0.15); text-align: center; }
    .login-card h2 { margin-top: 0; color: #ff0000; font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    .login-card p { color: #aaa; font-size: 15px; margin-bottom: 30px; }
    .login-card input { width: 100%; padding: 15px; margin-bottom: 18px; border: 1px solid #444; background: #1a1a1a; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; }
    .login-card input::placeholder { color: #777; }
    .login-card button { width: 100%; background: #ff0000; color: #fff; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    .login-card button:hover { background: #cc0000; }
    .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 15px; display: none; }

    .container { max-width: 1100px; margin: 40px auto; background: #111; border: 1px solid #333; padding: 35px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 20px; }
    h1 { color: #ff0000; margin: 0; font-size: 26px; }
    .header-actions { display: flex; gap: 10px; }
    .btn-pdf { background: #222; color: #fff; border: 1px solid #ff0000; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-pdf:hover { background: #ff0000; }
    .btn-logout { background: #ff0000; color: #fff; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-logout:hover { background: #cc0000; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 8px; text-align: center; }
    .stat-card h3 { margin: 0 0 5px 0; font-size: 13px; text-transform: uppercase; color: #aaa; }
    .stat-card .val { font-size: 20px; font-weight: bold; margin-bottom: 3px; }
    .stat-card .amount { font-size: 14px; color: #888; }
    
    .card-stock .val { color: #2ecc71; }
    .card-reservado .val { color: #f39c12; }
    .card-vendido .val { color: #e74c3c; }
    .card-total .val { color: #ff0000; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #333; padding: 14px; text-align: left; color: #ddd; vertical-align: middle; }
    th { background: #1a1a1a; color: #fff; }
    tr:nth-child(even) { background: #161616; }
    
    .img-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .car-img { width: 70px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #444; }
    .img-count { font-size: 11px; color: #aaa; }

    .status-select { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: #fff; font-weight: bold; cursor: pointer; }
    .status-Disponible { color: #2ecc71; border-color: #2ecc71; }
    .status-Reservado { color: #f39c12; border-color: #f39c12; }
    .status-Vendido { color: #e74c3c; border-color: #e74c3c; }
    
    .btn-delete { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .btn-delete:hover { background: #ff0000; }

    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0; }
      .login-card, .header-actions, .btn-delete, .status-select { display: none !important; }
      .container { max-width: 100% !important; border: none !important; box-shadow: none !important; background: #fff !important; margin: 0 !important; padding: 0 !important; }
      h1 { color: #000 !important; font-size: 22px !important; text-align: center; }
      .stat-card { background: #f8f9fa !important; border: 1px solid #ccc !important; }
      .stat-card h3 { color: #333 !important; }
      .stat-card .val, .stat-card .amount { color: #000 !important; }
      table { border: 1px solid #000 !important; }
      th { background: #eee !important; color: #000 !important; border: 1px solid #000 !important; }
      td { border: 1px solid #ccc !important; color: #000 !important; }
      .img-box { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE ACCESO -->
  <div class="login-card" id="login-screen">
    <h2>CRESTMONT MOTORS</h2>
    <p>Acceso a Control de Inventario</p>
    <input type="text" id="login-user" placeholder="Usuario">
    <input type="password" id="login-pass" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Iniciar Sesión</button>
    <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos</div>
  </div>

  <!-- PANEL DE INVENTARIO -->
  <div class="container" id="panel-inventario">
    <div class="header-bar">
      <h1>Control de Inventario Privado</h1>
      <div class="header-actions">
        <button class="btn-pdf" onclick="exportarPDF()">📄 Reporte PDF Contable</button>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card card-stock">
        <h3>En Stock (Disponible)</h3>
        <div class="val" id="cnt-disponible">0 carros</div>
        <div class="amount" id="sum-disponible">$0</div>
      </div>
      <div class="stat-card card-reservado">
        <h3>Reservados</h3>
        <div class="val" id="cnt-reservado">0 carros</div>
        <div class="amount" id="sum-reservado">$0</div>
      </div>
      <div class="stat-card card-vendido">
        <h3>Vendidos</h3>
        <div class="val" id="cnt-vendido">0 carros</div>
        <div class="amount" id="sum-vendido">$0</div>
      </div>
      <div class="stat-card card-total">
        <h3>Total General</h3>
        <div class="val" id="cnt-total">0 carros</div>
        <div class="amount" id="sum-total">$0</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Fotos</th>
          <th>VIN / Chasis</th>
          <th>Vehículo</th>
          <th>Año</th>
          <th>Precio ($)</th>
          <th>Estado de Venta</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="lista-inventario"></tbody>
    </table>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (sessionStorage.getItem("inventario_autorizado") === "true") {
        mostrarPanel();
      }
    });

    function iniciarSesion() {
      const u = document.getElementById("login-user").value.trim();
      const p = document.getElementById("login-pass").value;
      const usuarios = JSON.parse(localStorage.getItem("usuarios_crestmont")) || [{ usuario: "admin", pass: "admin123" }];
      const coincide = usuarios.some(user => user.usuario === u && user.pass === p);

      if (coincide || (u === "admin" && p === "admin123")) {
        sessionStorage.setItem("inventario_autorizado", "true");
        mostrarPanel();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function mostrarPanel() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("panel-inventario").style.display = "block";
      cargarInventario();
    }

    function cerrarSesion() {
      sessionStorage.removeItem("inventario_autorizado");
      window.location.reload();
    }

    function cargarInventario() {
      const lista = document.getElementById("lista-inventario");
      lista.innerHTML = "";
      const inventario = JSON.parse(localStorage.getItem("inventario_crestmont")) || [];

      let cntDisp = 0, sumDisp = 0;
      let cntRes = 0, sumRes = 0;
      let cntVend = 0, sumVend = 0;

      if (inventario.length === 0) {
        lista.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#777; padding:25px;">No hay vehículos registrados. Publica uno desde el panel principal.</td></tr>`;
      } else {
        inventario.forEach((item, index) => {
          const precioNum = parseFloat(item.precio) || 0;
          
          if (item.estado === "Disponible") {
            cntDisp++;
            sumDisp += precioNum;
          } else if (item.estado === "Reservado") {
            cntRes++;
            sumRes += precioNum;
          } else if (item.estado === "Vendido") {
            cntVend++;
            sumVend += precioNum;
          }

          // Soporte tanto para 'imagenes' (múltiples) como 'imagen' (única previa)
          let imgs = item.imagenes || (item.imagen ? [item.imagen] : []);
          let imgTag = `<span style="color:#666;">Sin fotos</span>`;
          
          if (imgs.length > 0) {
            imgTag = `
              <div class="img-box">
                <img src="${imgs[0]}" class="car-img">
                <span class="img-count">📸 ${imgs.length} foto(s)</span>
              </div>
            `;
          }
          
          lista.innerHTML += `
            <tr>
              <td>${imgTag}</td>
              <td><strong>${item.vin}</strong></td>
              <td>${item.vehiculo}</td>
              <td>${item.ano}</td>
              <td>$${precioNum.toLocaleString()}</td>
              <td>
                <select class="status-select status-${item.estado}" onchange="cambiarEstado(${index}, this.value)">
                  <option value="Disponible" ${item.estado === "Disponible" ? "selected" : ""}>Disponible</option>
                  <option value="Reservado" ${item.estado === "Reservado" ? "selected" : ""}>Reservado</option>
                  <option value="Vendido" ${item.estado === "Vendido" ? "selected" : ""}>Vendido</option>
                </select>
              </td>
              <td><button class="btn-delete" onclick="eliminarItem(${index})">Eliminar</button></td>
            </tr>
          `;
        });
      }

      document.getElementById("cnt-disponible").innerText = `${cntDisp} carros`;
      document.getElementById("sum-disponible").innerText = `$${sumDisp.toLocaleString()}`;

      document.getElementById("cnt-reservado").innerText = `${cntRes} carros`;
      document.getElementById("sum-reservado").innerText = `$${sumRes.toLocaleString()}`;

      document.getElementById("cnt-vendido").innerText = `${cntVend} carros`;
      document.getElementById("sum-vendido").innerText = `$${sumVend.toLocaleString()}`;

      document.getElementById("cnt-total").innerText = `${inventario.length} carros`;
      document.getElementById("sum-total").innerText = `$${(sumDisp + sumRes + sumVend).toLocaleString()}`;
    }

    function cambiarEstado(index, nuevoEstado) {
      let inventario = JSON.parse(localStorage.getItem("inventario_crestmont")) || [];
      inventario[index].estado = nuevoEstado;
      localStorage.setItem("inventario_crestmont", JSON.stringify(inventario));
      cargarInventario();
    }

    function eliminarItem(index) {
      if (confirm("¿Estás segura de eliminar este vehículo del registro?")) {
        let inventario = JSON.parse(localStorage.getItem("inventario_crestmont")) || [];
        inventario.splice(index, 1);
        localStorage.setItem("inventario_crestmont", JSON.stringify(inventario));
        cargarInventario();
      }
    }

    function exportarPDF() {
      window.print();
    }
  </script>

</body>
</html>
