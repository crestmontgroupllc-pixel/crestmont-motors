<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inventario - Crestmont Motors</title>
  <style>
    body { font-family: Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
    
    /* LOGIN ESTILO NEGRO Y MODERNO */
    .login-card { max-width: 420px; margin: 100px auto; background: #111; border: 1px solid #333; padding: 45px; border-radius: 10px; box-shadow: 0 8px 25px rgba(255,0,0,0.15); text-align: center; }
    .login-card h2 { margin-top: 0; color: #ff0000; font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    .login-card p { color: #aaa; font-size: 15px; margin-bottom: 30px; }
    .login-card input { width: 100%; padding: 15px; margin-bottom: 18px; border: 1px solid #444; background: #1a1a1a; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; }
    .login-card input::placeholder { color: #777; }
    .login-card button { width: 100%; background: #ff0000; color: #fff; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    .login-card button:hover { background: #cc0000; }
    .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 15px; display: none; }

    /* PANEL DE INVENTARIO */
    .container { max-width: 1000px; margin: 40px auto; background: #111; border: 1px solid #333; padding: 35px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 20px; }
    h1 { color: #ff0000; margin: 0; font-size: 26px; }
    .btn-logout { background: #ff0000; color: #fff; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-logout:hover { background: #cc0000; }
    .form-group { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .form-group input, .form-group select { padding: 12px; border: 1px solid #444; background: #1a1a1a; color: #fff; border-radius: 6px; flex: 1; min-width: 150px; font-size: 14px; }
    .btn-add { background: #ff0000; color: #fff; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-add:hover { background: #cc0000; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #333; padding: 14px; text-align: left; color: #ddd; }
    th { background: #1a1a1a; color: #fff; }
    tr:nth-child(even) { background: #161616; }
    .status-disponible { color: #2ecc71; font-weight: bold; }
    .status-vendido { color: #e74c3c; font-weight: bold; }
    .btn-delete { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .btn-delete:hover { background: #ff0000; }
  </style>
</head>
<body>

  <!-- PANTALLA DE ACCESO -->
  <div class="login-card" id="login-screen">
    <h2>CRESTMONT MOTORS</h2>
    <p>Acceso a Control de Inventario</p>
    <input type="text" id="login-user" placeholder="Usuario">
    <input type="password" id="login-pass" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Iniciar Sesión</button>
    <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos</div>
  </div>

  <!-- PANEL DE INVENTARIO -->
  <div class="container" id="panel-inventario">
    <div class="header-bar">
      <h1>Control de Inventario Privado</h1>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div class="form-group">
      <input type="text" id="vin" placeholder="VIN / Chasis">
      <input type="text" id="vehiculo" placeholder="Vehículo (Ej: Ford Mustang)">
      <input type="number" id="ano" placeholder="Año">
      <input type="number" id="precio" placeholder="Precio ($)">
      <select id="estado">
        <option value="Disponible">Disponible</option>
        <option value="Reservado">Reservado</option>
        <option value="Vendido">Vendido</option>
      </select>
      <button class="btn-add" onclick="agregarVehiculo()">+ Agregar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>VIN</th>
          <th>Vehículo</th>
          <th>Año</th>
          <th>Precio</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="lista-inventario"></tbody>
    </table>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (sessionStorage.getItem("inventario_autorizado") === "true") {
        mostrarPanel();
      }
    });

    function iniciarSesion() {
      const u = document.getElementById("login-user").value.trim();
      const p = document.getElementById("login-pass").value;
      const usuarios = JSON.parse(localStorage.getItem("usuarios_crestmont")) || [{ usuario: "admin", pass: "admin123" }];
      const coincide = usuarios.some(user => user.usuario === u && user.pass === p);

      if (coincide || (u === "admin" && p === "admin123")) {
        sessionStorage.setItem("inventario_autorizado", "true");
        mostrarPanel();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function mostrarPanel() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("panel-inventario").style.display = "block";
      cargarInventario();
    }

    function cerrarSesion() {
      sessionStorage.removeItem("inventario_autorizado");
      window.location.reload();
    }

    function agregarVehiculo() {
      const vin = document.getElementById("vin").value;
      const vehiculo = document.getElementById("vehiculo").value;
      const ano = document.getElementById("ano").value;
      const precio = document.getElementById("precio").value;
      const estado = document.getElementById("estado").value;

      if (!vin || !vehiculo || !precio) {
        alert("Por favor completa los campos principales (VIN, Vehículo, Precio).");
        return;
      }

      const nuevoItem = { vin, vehiculo, ano, precio, estado };
      let inventario = JSON.parse(localStorage.getItem("inventario_crestmont")) || [];
      inventario.push(nuevoItem);
      localStorage.setItem("inventario_crestmont", JSON.stringify(inventario));

      document.getElementById("vin").value = "";
      document.getElementById("vehiculo").value = "";
      document.getElementById("ano").value = "";
      document.getElementById("precio").value = "";
      cargarInventario();
    }

    function cargarInventario() {
      const lista = document.getElementById("lista-inventario");
      lista.innerHTML = "";
      const inventario = JSON.parse(localStorage.getItem("inventario_crestmont")) || [];

      inventario.forEach((item, index) => {
        const claseEstado = item.estado === "Vendido" ? "status-vendido" : "status-disponible";
        lista.innerHTML += `
          <tr>
            <td>${item.vin}</td>
            <td>${item.vehiculo}</td>
            <td>${item.ano}</td>
            <td>$${Number(item.precio).toLocaleString()}</td>
            <td class="${claseEstado}">${item.estado}</td>
            <td><button class="btn-delete" onclick="eliminarItem(${index})">Eliminar</button></td>
          </tr>
        `;
      });
    }

    function eliminarItem(index) {
      let inventario = JSON.parse(localStorage.getItem("inventario_crestmont")) || [];
      inventario.splice(index, 1);
      localStorage.setItem("inventario_crestmont", JSON.stringify(inventario));
      cargarInventario();
    }
  </script>

</body>
</html>
